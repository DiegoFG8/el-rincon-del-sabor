<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruleta de Premios - El Rincón Del Sabor</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      color: #4e342e;
      background: radial-gradient(
          50% 50% at 100% 0,
          #ca3f3f 0% 5%, #ffffff 6% 15%, #ca3f3f 16% 25%, #ffffff 26% 35%, #ca3f3f 36% 45%, #ffffff 46% 55%, #ca3f3f 56% 65%, #ffffff 66% 75%, #ca3f3f 76% 85%, #ffffff 86% 95%, #0000 96%
        ),
        radial-gradient(
          50% 50% at 0 100%,
          #ca3f3f 0% 5%, #ffffff 6% 15%, #ca3f3f 16% 25%, #ffffff 26% 35%, #ca3f3f 36% 45%, #ffffff 46% 55%, #ca3f3f 56% 65%, #ffffff 66% 75%, #ca3f3f 76% 85%, #ffffff 86% 95%, #0000 96%
        ),
        radial-gradient(
          50% 50%,
          #ca3f3f 0% 5%, #ffffff 6% 15%, #ca3f3f 16% 25%, #ffffff 26% 35%, #ca3f3f 36% 45%, #ffffff 46% 55%, #ca3f3f 56% 65%, #ffffff 66% 75%, #ca3f3f 76% 85%, #ffffff 86% 95%, #0000 96%
        ) 38px 38px;
      background-size: 76px 76px;
      background-color: #ca3f3f;
    }

    /* Navbar animada */
    .navbar {
      background: linear-gradient(90deg, #ffccbc, #f8bbd0, #c5e1a5, #b3e5fc);
      background-size: 300% 300%;
      animation: gradientMove 10s ease infinite;
    }

    .navbar-brand {
      font-weight: bold;
      color: #4e342e !important;
    }

    .nav-link {
      color: #4e342e !important;
      font-weight: 500;
      transition: transform 0.3s ease;
    }

    .nav-link:hover {
      transform: scale(1.1);
      color: #6f4e37 !important;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Contenedor Ruleta */
    .contenedor-ruleta {
      max-width: 650px;
      margin: 40px auto;
      padding: 30px;
      background-color: rgba(255,255,255,0.95);
      border-radius: 20px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.3);
      text-align: center;
    }

    h2 {
      color: #6f4e37;
      border-bottom: 4px dashed #ff80ab;
      padding-bottom: 10px;
    }

    .wheel-wrapper {
      position: relative;
      width: 380px;
      height: 380px;
      margin: 30px auto;
    }

    .pointer {
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-top: 35px solid #ca3f3f;
      z-index: 10;
      filter: drop-shadow(0px 3px 5px rgba(0,0,0,0.4));
    }

    #wheelCanvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 8px solid #ffffff;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
      transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
    }

    .btn-girar {
      background: linear-gradient(45deg, #ff80ab, #ffb74d);
      color: white;
      font-weight: bold;
      border: none;
      padding: 12px 40px;
      border-radius: 25px;
      font-size: 1.2em;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: transform 0.2s;
    }

    .btn-girar:hover {
      transform: scale(1.05);
    }

    .btn-girar:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">☕ El Rincón Del Sabor 🍩</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="pagina2.html">Misión y Valores</a></li>
          <li class="nav-item"><a class="nav-link" href="Historia.html">Historia</a></li>
          <li class="nav-item"><a class="nav-link" href="Servicios.html">Servicios</a></li>
          <li class="nav-item"><a class="nav-link" href="Producto.html">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="Buyer_Persona.html">Buyer Persona</a></li>
          <li class="nav-item"><a class="nav-link fw-bold text-danger" href="ruleta.html">🎯 Ruleta</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Sección Ruleta -->
  <div class="contenedor-ruleta">
    <h2>🎯 Ruleta de Sorpresas 🍩</h2>
    <p>¡Gira la ruleta y descubre tu premio para tu próxima visita!</p>

    <div class="wheel-wrapper">
      <div class="pointer"></div>
      <canvas id="wheelCanvas" width="500" height="500"></canvas>
    </div>

    <button class="btn-girar" id="btnGirar" onclick="spinWheel()">¡Girar Ahora!</button>
  </div>

  <!-- Modal para mostrar el premio -->
  <div class="modal fade" id="premioModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content text-center p-4" style="border-radius: 20px;">
        <div class="modal-body">
          <h3 class="mb-3" style="color: #6f4e37;">🎉 ¡Felicidades! 🎉</h3>
          <p class="fs-4 fw-bold" id="premioTexto" style="color: #ca3f3f;"></p>
          <button type="button" class="btn btn-secondary mt-3 rounded-pill px-4" data-bs-dismiss="modal">Aceptar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');

    const opciones = [
      { label: "Consumo GRATIS", color: "#e91e63" },
      { label: "3 Cafés Gratis", color: "#f57c00" },
      { label: "Pastel Gratis", color: "#388e3c" },
      { label: "Bebida Casa Gratis", color: "#1976d2" },
      { label: "2x1 Bebidas", color: "#7b1fa2" },
      { label: "15% Descuento", color: "#fbc02d" },
      { label: "Vuelve Mañana", color: "#d84315" }
    ];

    const numOpciones = opciones.length;
    const arcSize = (2 * Math.PI) / numOpciones;
    let currentRotation = 0;

    function drawWheel() {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const outsideRadius = canvas.width / 2 - 10;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < numOpciones; i++) {
        // Ángulo de inicio y fin para cada sector partiendo desde arriba
        const startAngle = i * arcSize - Math.PI / 2;
        const endAngle = startAngle + arcSize;

        // Dibujar Sector
        ctx.fillStyle = opciones[i].color;
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, outsideRadius, startAngle, endAngle, false);
        ctx.lineTo(centerX, centerY);
        ctx.fill();

        // Línea divisoria blanca entre sectores
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 4;
        ctx.stroke();

        // Dibujar Texto
        ctx.save();
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 16px 'Poppins', Arial, sans-serif";
        ctx.shadowColor = "rgba(0, 0, 0, 0.6)";
        ctx.shadowBlur = 4;

        // Posicionar el pincel en el centro de cada sector
        const angleMid = startAngle + arcSize / 2;
        ctx.translate(
          centerX + Math.cos(angleMid) * (outsideRadius * 0.62),
          centerY + Math.sin(angleMid) * (outsideRadius * 0.62)
        );
        
        // Orientar el texto radialmente hacia el centro
        ctx.rotate(angleMid + Math.PI / 2);

        const text = opciones[i].label;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(text, 0, 0);

        ctx.restore();
      }

      // Círculo central decorativo
      ctx.beginPath();
      ctx.arc(centerX, centerY, 30, 0, 2 * Math.PI);
      ctx.fillStyle = "#ffffff";
      ctx.fill();
      ctx.strokeStyle = "#ca3f3f";
      ctx.lineWidth = 4;
      ctx.stroke();
    }

    // Dibujar inmediatamente
    drawWheel();

    // Redibujar una vez cargadas las fuentes para garantizar que el texto se muestre
    document.fonts.ready.then(function () {
      drawWheel();
    });

    function spinWheel() {
      const btn = document.getElementById('btnGirar');
      btn.disabled = true;

      // Generar giro aleatorio (mínimo 4 giros completos)
      const randomDegree = Math.floor(Math.random() * 360) + 1440;
      currentRotation += randomDegree;

      canvas.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        const degreesModulo = currentRotation % 360;
        const actualDegree = (360 - degreesModulo) % 360;
        const index = Math.floor(actualDegree / (360 / numOpciones));
        const premioGanado = opciones[index].label;

        document.getElementById('premioTexto').innerText = premioGanado;
        const premioModal = new bootstrap.Modal(document.getElementById('premioModal'));
        premioModal.show();

        btn.disabled = false;
      }, 4000);
    }
  </script>
</body>
</html>
